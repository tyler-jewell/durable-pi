# dpi-network.example.yaml → copy to dpi-network.yaml (gitignored) and add your own machines.
#
#   cp dpi-network.example.yaml dpi-network.yaml
#
# Every device runs apps/dpi-backend. Clients (the web hub, dpi-tui, curl) connect with a URL and a
# bearer token. No code or recipe names a machine: `just net <verb> <id>` looks the id up here and
# runs the driver for its `kind`.
#
#   just net up <id>        provision → deploy → env → service → (expose) → register, idempotent
#   just net status         probe every device
#   just net logs <id> | just net restart <id> | just net down <id> | just net deploy <id>
#   just net destroy <id>   exe-dev only; refuses any VM not named in this file
#
# Kinds
#   local            this machine; `just backend run` runs it in a terminal, or set `service: launchd|systemd`
#   ssh              any host reachable with `ssh <ssh>`; nvm + rsync + launchd (macOS) or systemd (Linux)
#   exe-dev          an exe.dev VM: the ssh driver at <vm>.exe.xyz plus VM create and HTTPS proxy exposure
#   apple-container  a macOS `container` CLI container: the backend runs in a Linux arm64 OCI image,
#                    published on the host's loopback (needs `container` installed: brew install container)
#   macos-vm         a headless macOS VM via Lima's vz driver: `just net up` creates it (limactl start,
#                    first run downloads + installs macOS), then uses the ssh steps + launchd (needs `limactl`)
#   url              connect only (someone else runs the backend); `just net register <id> --token <t>`
#
# Tokens never live here. Each device generates its own in <home_dir>/backend.env, and
# `just net register <id>` copies it into ~/.dpi/network.sqlite on this machine.

# Each device's <home_dir>/backend.env is written from this file and nothing else:
#   DPI_TOKEN        generated on the first `just net up`, kept after (new one: just net rotate <id>)
#   DPI_DEVICE_NAME  the device id
#   DPI_PORT         port
#   DPI_HOST         host (default 127.0.0.1 for kind local, 0.0.0.0 otherwise)
#   DPI_START_DIRS   start_dirs, colon-separated
#   <NAME>=<value>   for each name in env_keys, with its value read from this checkout's .env
#   <NAME>=<value>   for each entry in env (defaults.env merged with the device's env)

defaults:
  port: 4780                       # dpi-backend port on every device
  node: 26                         # Node major installed with nvm on ssh / exe-dev devices
  code_dir: ~/dpi                  # where apps/dpi-backend + apps/dpi-sdk are synced (ssh / exe-dev)
  home_dir: ~/.dpi                 # backend.env, data and logs; deploys never touch it
  start_dirs: ["~/dpi-work"]       # where new sessions start (created if missing); any existing folder works as a cwd
  env_keys: [OPENROUTER_API_KEY]   # secrets: copied by name from .env, never written here
  #   deepseek:               env_keys: [DEEPSEEK_API_KEY]
  #   cloudflare-ai-gateway:  env_keys: [CLOUDFLARE_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_GATEWAY_ID]
  # env:                           # plain settings, written as-is
  #   DPI_PROVIDER: faux           # the free deterministic model, for tests (openrouter | deepseek | cloudflare-ai-gateway | faux)

devices:
  local:
    name: Laptop
    kind: local

  # A Mac or Linux box you can reach with passwordless ssh.
  # mac-mini:
  #   name: Mac mini
  #   kind: ssh
  #   ssh: me@my-mac-mini.local
  #   service: launchd               # systemd on Linux (needs passwordless sudo)
  #   url: http://my-mac-mini.local:4780
  #   start_dirs: ["~/dpi-work"]

  # An Apple Container (the macOS `container` CLI): the backend runs in a Linux arm64
  # container published on this Mac's loopback. `just net up apple-box` creates, deploys
  # and starts it; `just net destroy apple-box` removes it.
  # apple-box:
  #   name: Apple container
  #   kind: apple-container
  #   port: 4782               # host port; the backend binds this port inside too
  #   image: node:26-bookworm-slim
  #   cpus: 2
  #   memory: 2048M
  #   start_dirs: ["~/dpi-work"]

  # A headless macOS VM via Lima's vz driver (needs `brew install lima`). The first
  # `just net up mac-box` downloads and installs macOS (slow); later ups are quick.
  # mac-box:
  #   name: macOS VM
  #   kind: macos-vm
  #   cpus: 2
  #   memory: 4GiB
  #   disk: 40                  # GiB
  #   start_dirs: ["~/dpi-work"]

  # An exe.dev VM (https://exe.dev). `just net up` creates it if missing and exposes it over HTTPS.
  # vm-1:
  #   name: exe.dev VM
  #   kind: exe-dev
  #   vm: my-dpi-vm-1                # VM name, also the public host: https://my-dpi-vm-1.exe.xyz
  #   create: { cpu: 2, memory: 4GB, disk: 20GB }
  #   start_dirs: ["~/work"]
