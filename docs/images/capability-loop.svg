<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The capability lifecycle: discover, validate, deploy, notify</title>
  <desc id="desc">An agent probes a host, inspects its model server over SSH, recommends a capability, a validation gate checks the evidence, the capability is enabled with auto-turn-on, a real end-to-end call confirms it works, and a readiness entry lands in the shared team feed.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    .step { fill: #1A1A1E; stroke: #2E2E34; stroke-width: 1.5; rx: 14; }
    .step-title { fill: #E8E8EC; font-size: 15px; font-weight: 600; }
    .step-sub { fill: #9B9BA4; font-size: 12px; }
    .arrow { stroke: #6B5A5E; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
    .tool { fill: #FF5252; font-size: 12px; font-weight: 700; }
    .host { fill: #4FB6FF; font-size: 12px; font-weight: 600; }
    .tag { fill: #2E7D32; font-size: 11px; font-weight: 600; }
    .feed { fill: #2E2E34; stroke: #4FB6FF; stroke-width: 2; rx: 12; }
    .feed-title { fill: #4FB6FF; font-size: 14px; font-weight: 700; }
    .feed-line { fill: #C8C8CE; font-size: 12px; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5A5E"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="600" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#E8E8EC">Capability lifecycle — discover → validate → deploy → notify</text>

  <!-- row 1: 7 steps -->
  <!-- 1 discover -->
  <g>
    <rect class="step" x="30" y="90" width="150" height="96"/>
    <text class="tool" x="44" y="118">discover_host</text>
    <text class="step-title" x="44" y="142">1 · Discover</text>
    <text class="step-sub" x="44" y="162">probe /health + /v1/models</text>
    <text class="host" x="44" y="178">9 models on studio</text>
  </g>
  <line class="arrow" x1="180" y1="138" x2="204" y2="138"/>

  <!-- 2 inspect -->
  <g>
    <rect class="step" x="208" y="90" width="150" height="96"/>
    <text class="tool" x="222" y="118">inspect_host</text>
    <text class="step-title" x="222" y="142">2 · Inspect</text>
    <text class="step-sub" x="222" y="162">SSH: processes, launchd, live test</text>
    <text class="host" x="222" y="178">live test ok (1.4 s)</text>
  </g>
  <line class="arrow" x1="358" y1="138" x2="382" y2="138"/>

  <!-- 3 recommend -->
  <g>
    <rect class="step" x="386" y="90" width="150" height="96"/>
    <text class="tool" x="400" y="118">recommend_capability</text>
    <text class="step-title" x="400" y="142">3 · Recommend</text>
    <text class="step-sub" x="400" y="162">clef-flash for jev-quality</text>
    <text class="tag" x="400" y="178">state: recommended</text>
  </g>
  <line class="arrow" x1="536" y1="138" x2="560" y2="138"/>

  <!-- 4 gate -->
  <g>
    <rect class="step" x="564" y="90" width="150" height="96"/>
    <text class="step-title" x="578" y="118">4 · Validate (gate)</text>
    <text class="step-sub" x="578" y="142">llama-server present</text>
    <text class="step-sub" x="578" y="158">+ live test healthy</text>
    <text class="tag" x="578" y="178">gate: passed</text>
  </g>
  <line class="arrow" x1="714" y1="138" x2="738" y2="138"/>

  <!-- 5 enable -->
  <g>
    <rect class="step" x="742" y="90" width="150" height="96"/>
    <text class="tool" x="756" y="118">enable_capability</text>
    <text class="step-title" x="756" y="142">5 · Deploy</text>
    <text class="step-sub" x="756" y="162">turn on now</text>
    <text class="tag" x="756" y="178">autoEnable: true</text>
  </g>
  <line class="arrow" x1="892" y1="138" x2="916" y2="138"/>

  <!-- 6 end-to-end -->
  <g>
    <rect class="step" x="920" y="90" width="150" height="96"/>
    <text class="tool" x="934" y="118">run_decision</text>
    <text class="step-title" x="934" y="142">6 · End-to-end</text>
    <text class="step-sub" x="934" y="162">real call through registry</text>
    <text class="host" x="934" y="178">approve (20.2 s)</text>
  </g>

  <!-- row 2: 7 notify + team feed -->
  <g>
    <rect class="step" x="920" y="210" width="150" height="96"/>
    <text class="tool" x="934" y="238">notify_ready</text>
    <text class="step-title" x="934" y="262">7 · Notify</text>
    <text class="step-sub" x="934" y="282">append readiness</text>
  </g>
  <line class="arrow" x1="920" y1="258" x2="896" y2="258"/>

  <!-- team feed -->
  <g>
    <rect class="feed" x="250" y="210" width="640" height="96"/>
    <text class="feed-title" x="264" y="238">team feed — ~/.dpi-mcp/team-feed.json</text>
    <text class="feed-line mono" x="264" y="262">[</text>
    <text class="feed-line mono" x="264" y="280">  { "kind": "capability-ready", "capability": "studio-decision-clef-flash-q4-k-m",</text>
    <text class="feed-line mono" x="264" y="296">    "host": "studio", "validated": { "liveTest": "ok", "endToEndMs": 20180 } }</text>
  </g>
  <line class="arrow" x1="250" y1="258" x2="226" y2="258"/>
  <text x="238" y="252" text-anchor="middle" fill="#9B9BA4" font-size="11">newest last</text>

  <text x="600" y="360" text-anchor="middle" fill="#9B9BA4" font-size="13">Every fact comes from the tools — the agent hardcodes nothing about the host.</text>
  <text x="600" y="384" text-anchor="middle" fill="#9B9BA4" font-size="13">A recommendation that fails the gate stays `recommended` and is never enabled.</text>

  <!-- legend -->
  <g transform="translate(30,420)">
    <rect width="14" height="14" rx="3" fill="#FF5252"/>
    <text x="20" y="12" fill="#C8C8CE" font-size="12">MCP tool (already in the system)</text>
    <rect x="220" width="14" height="14" rx="3" fill="#2E7D32"/>
    <text x="240" y="12" fill="#C8C8CE" font-size="12">decision the gate made</text>
    <rect x="420" width="14" height="14" rx="3" fill="#4FB6FF"/>
    <text x="440" y="12" fill="#C8C8CE" font-size="12">live host fact the agent observed</text>
  </g>
</svg>
